{
  "schema_version": "1.1",
  "name": "quoted-mention",
  "tags": [
    "trigger",
    "negative"
  ],
  "runs": 1,
  "execution": {
    "max_turns": 6,
    "timeout_seconds": 120,
    "allowed_tools": [
      "Read",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-not-selected",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?agent-collab\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "corrected-sentence",
      "type": "regex",
      "target": "last_message",
      "pattern": "^The guide says \"use agent collab\" for an independent review\\.\\s*$"
    }
  ]
}
