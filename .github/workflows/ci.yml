name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      # Provider CLIs and the Codex system skill are not available here, so
      # their release steps are reported as SKIPPED; run
      # scripts/release-check.sh without --ci before publishing a release.
      - name: Release checks (CI mode)
        env:
          PYTHON: python
        run: scripts/release-check.sh --ci

  # The discovery suite asserts POSIX modes and process groups; Windows runs
  # its own checks of Job Object supervision, gates, locks, and resolution.
  windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile runtime
        run: python -m py_compile tools/agent-collab/scripts/*.py
      - name: Package synchronization
        env:
          PYTHON: python
        run: scripts/sync-packages.sh --check
      - name: Windows runtime checks
        run: python tests/windows_runtime_checks.py -v
