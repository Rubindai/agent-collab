name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: node # Latest stable, excluding prereleases.
          check-latest: true
      - name: Install current validators and provider CLIs
        run: |
          python -m pip install --disable-pip-version-check --upgrade jsonschema PyYAML
          npm install --prefix "$RUNNER_TEMP/provider-clis" --ignore-scripts --include=optional --no-audit --no-fund @openai/codex@latest @anthropic-ai/claude-code@latest
          # npm 12 disables lifecycle scripts by default. Run Anthropic's
          # documented native-binary installation step explicitly.
          node "$RUNNER_TEMP/provider-clis/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/provider-clis/node_modules/.bin" >> "$GITHUB_PATH"
      # Every provider check is required, requires no credentials, and can also
      # be run independently with scripts/ci-provider-checks.sh.
      - name: Release checks (CI mode)
        env:
          PYTHON: python
        run: scripts/release-check.sh --ci

  # The discovery suite asserts POSIX modes and process groups; Windows runs
  # its own checks of Job Object supervision, gates, locks, and resolution.
  windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Compile runtime
        run: python -m py_compile tools/agent-collab/scripts/*.py
      - name: Package synchronization
        env:
          PYTHON: python
        run: scripts/sync-packages.sh --check
      - name: Windows runtime checks
        run: python tests/windows_runtime_checks.py -v
