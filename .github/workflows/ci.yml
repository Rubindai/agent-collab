name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      # Provider CLIs and the Codex system skill are not available here, so
      # their release steps are reported as SKIPPED; run
      # scripts/release-check.sh without --ci before publishing a release.
      - name: Release checks (CI mode)
        env:
          PYTHON: python
        run: scripts/release-check.sh --ci
