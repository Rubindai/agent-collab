{
  "schema_version": "1.1",
  "name": "implicit-substantial-review",
  "tags": [
    "trigger",
    "positive"
  ],
  "runs": 1,
  "execution": {
    "max_turns": 6,
    "timeout_seconds": 120,
    "allowed_tools": [
      "Read",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-selected",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?agent-collab\"",
      "min": 1,
      "arm": "with-only"
    },
    {
      "name": "honest-unstarted-status",
      "type": "regex",
      "target": "last_message",
      "pattern": "^PEER_STATUS=not_run\\s*$",
      "flags": "m"
    }
  ]
}
